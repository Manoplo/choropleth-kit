name: Size

# Comments on the PR how much the bundle grew or shrank compared with the base branch.
# (The hard limits live in `.size-limit.json` and are enforced by `pnpm verify`.)
on:
  pull_request:
    branches: [develop, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PRs from forks get a read-only token and cannot comment: do not fail them for that.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
          build_script: build
