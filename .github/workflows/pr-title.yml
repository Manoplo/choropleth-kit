name: PR title

# The history uses Conventional Commits ("feat: …", "fix: …"). This keeps squash-merged titles consistent,
# which is what a changelog generator (see FEAT-015) will read.
on:
  pull_request_target:
    branches: [develop, master]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This job never checks out or runs PR code, so `pull_request_target` is safe here.
      # Third-party action: pinned to a commit SHA (v5.5.3); Dependabot keeps it up to date.
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
